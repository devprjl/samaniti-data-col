[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-robust"
version = "0.3.0"
description = "Convert Nepali / Hindi / English PDFs and images to Markdown with EasyOCR and Docling"
readme = "README.md"
# Python 3.10-3.13. 3.13 is recommended.
requires-python = ">=3.10,<3.14"
dependencies = [
    "docling[easyocr]>=2.28.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0", "mypy>=1.10.0", "pytest>=8.0.0"]

[project.scripts]
ocr-robust = "main:main"

[tool.setuptools]
packages = ["ocr"]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
