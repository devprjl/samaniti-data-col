[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-robust"
version = "0.2.0"
description = "Multilingual OCR (Nepali / Hindi / English) with toggleable PaddleOCR, SuryaOCR and EasyOCR engines"
readme = "README.md"
# Python 3.10-3.13. 3.13 is recommended.
# 3.14+ is excluded because the optional engines have no wheels there:
# paddlepaddle publishes no cp314 build, and surya-ocr pins Pillow<11 whose
# newest release (10.4.0) stops at cp313. On 3.14 the base install still works,
# but only the EasyOCR engine is available.
requires-python = ">=3.10,<3.14"
dependencies = [
    "docling[easyocr]>=2.28.0",
]

[project.optional-dependencies]
# PaddleOCR needs a separate PaddlePaddle runtime, which has no wheels for
# some interpreters (notably Python 3.14). Keep it opt-in so the base install
# never fails.
paddle = ["paddleocr"]
surya = ["surya-ocr"]
all = ["paddleocr", "surya-ocr"]
dev = ["ruff>=0.4.0", "mypy>=1.10.0", "pytest>=8.0.0"]

[project.scripts]
ocr-robust = "main:main"

[tool.setuptools]
packages = ["ocr", "ocr.engines"]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
